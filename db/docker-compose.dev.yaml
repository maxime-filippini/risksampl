version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=risksampl
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - '55001:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d risksampl']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
