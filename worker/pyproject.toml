[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "fastapi[standard]>=0.116.1",
    "pandas>=2.3.2",
    "polars>=1.32.3",
    "psycopg2>=2.9.10",
    "pyarrow>=21.0.0",
    "pydantic-settings>=2.10.1",
    "scipy>=1.16.1",
    "sqlalchemy>=2.0.43",
    "tenacity>=9.1.2",
    "var-lab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
include = ["scripts/", "notebooks/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
force-single-line = true

[tool.uv]
dev-dependencies = ["ipykernel>=6.30.1", "pytest>=8.4.2"]

[tool.uv.sources]
var-lab = { path = "../var-lab", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
