[project]
name = "risksampl-services"
version = "0.1.0"
description = "One-shot data and publication services for VaR Labs"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.32.3",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pyarrow>=21.0.0",
    "pytest>=9.0.2",
    "ruff>=0.14.0",
    "ty>=0.0.1a6",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
